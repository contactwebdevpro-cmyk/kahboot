<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kahoot Multi-Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-2xl mx-auto p-6">
    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">
        Kahoot Bot Spawner
      </h1>
      <p class="text-gray-400 mt-2">Interface moderne • Jusqu'à 600 bots</p>
    </div>

    <div class="bg-gray-900 rounded-3xl p-8 shadow-2xl border border-gray-800">
      <form id="botForm" class="space-y-6">
        <div>
          <label class="block text-sm font-medium mb-2">Game PIN</label>
          <input type="number" name="game_pin" required
                 class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-5 py-4 focus:outline-none focus:border-purple-500">
        </div>

        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium mb-2">Nom de base</label>
            <input type="text" name="base_name" value="Bot" required
                   class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-5 py-4">
          </div>
          <div>
            <label class="block text-sm font-medium mb-2">Nombre de bots</label>
            <input type="number" name="nb_bots" value="50" min="1" max="600" required
                   class="w-full bg-gray-800 border border-gray-700 rounded-2xl px-5 py-4">
          </div>
        </div>

        <div class="flex items-center gap-3">
          <input type="checkbox" name="auto_reconnect" id="reconnect" class="w-5 h-5 accent-purple-600">
          <label for="reconnect" class="text-sm">Auto-reconnexion</label>
        </div>

        <button type="submit"
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 py-5 rounded-2xl font-semibold text-lg transition-all active:scale-95">
          <i class="fas fa-rocket mr-2"></i>
          LANCER LES BOTS
        </button>
      </form>
    </div>

    <div id="status" class="mt-6 text-center"></div>
  </div>

  <script>
    const form = document.getElementById('botForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);

      status.innerHTML = `<p class="text-yellow-400">Lancement en cours...</p>`;

      const res = await fetch('/start', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();

      if (data.status === 'success') {
        status.innerHTML = `
          <div class="bg-green-900 border border-green-700 rounded-2xl p-6">
            <p class="text-green-400 font-semibold">${data.message}</p>
            <p class="text-sm text-gray-400 mt-2">Session ID: <span class="font-mono">${data.session_id}</span></p>
            <button onclick="stopSession('${data.session_id}')" 
                    class="mt-4 text-red-400 hover:text-red-500">
              <i class="fas fa-stop"></i> Arrêter
            </button>
          </div>`;
      } else {
        status.innerHTML = `<p class="text-red-400">${data.error}</p>`;
      }
    });

    async function stopSession(id) {
      await fetch(`/stop/${id}`);
      status.innerHTML = `<p class="text-gray-400">Session arrêtée.</p>`;
    }
  </script>
</body>
</html>
