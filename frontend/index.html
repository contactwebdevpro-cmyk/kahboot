<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahoot Bot Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎮 Kahoot Bot Manager</h1>
            <p>Démarrer et gérer vos bots Kahoot</p>
        </header>

        <main class="main-content">
            <div class="form-section">
                <div class="form-card">
                    <h2>Configuration des bots</h2>
                    <form id="botForm">
                        <div class="form-group">
                            <label for="gamePin">Code partie Kahoot</label>
                            <input 
                                type="number" 
                                id="gamePin" 
                                placeholder="Ex: 123456"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="baseName">Nom des bots</label>
                            <input 
                                type="text" 
                                id="baseName" 
                                placeholder="Ex: Player"
                                required
                            >
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="nbBots">Nombre de bots</label>
                                <input 
                                    type="number" 
                                    id="nbBots" 
                                    min="1" 
                                    max="800"
                                    value="10"
                                    required
                                >
                            </div>

                            <div class="form-group checkbox-group">
                                <label>
                                    <input type="checkbox" id="autoReconnect">
                                    <span>Reconnexion auto</span>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            ▶️ Démarrer les bots
                        </button>
                    </form>
                </div>
            </div>

            <div class="status-section">
                <div class="status-card">
                    <h2>Sessions actives</h2>
                    <div id="statusContainer" class="status-list">
                        <p class="empty-state">Aucune session active</p>
                    </div>
                </div>

                <div class="info-card">
                    <h3>Informations</h3>
                    <div id="infoContainer" class="info-grid">
                        <div class="info-item">
                            <span class="label">Sessions:</span>
                            <span class="value" id="sessionCount">0</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Bots totaux:</span>
                            <span class="value" id="botsCount">0</span>
                        </div>
                        <div class="info-item">
                            <span class="label">Serveur:</span>
                            <span class="value" id="serverStatus">Vérification...</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Made with ❤️</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
